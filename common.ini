; The board every game runs on, read by each project's platformio.ini through extra_configs.
; A game builds on [board] with `extends = board`; one that needs more flags appends them to
; ${board.build_flags}.

[board]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
; TFT_eSPI config lives here so it survives `pio run -t clean` and library updates
tft_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Only the built-in GLCD font is drawn; every other font costs flash
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT=1
    ; Silences TFT_eSPI's warning about the unwired touch pin
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
; lib/dotui includes the game's own Theme.h, which names its colour slots
build_flags =
    ${board.tft_flags}
    -I$PROJECT_DIR/src/ui
; The engine's libraries, for a project in games/<id>; the launcher, one level up, names its own
lib_extra_dirs = ../../lib
