[platformio]
default_envs = esp32dev
extra_configs = ../common.ini

[env:esp32dev]
extends = board
build_flags =
    ${board.tft_flags}
    -I$PROJECT_DIR/../shared

; Serial `shot` for tools/screenshot.py and `play <n>`: pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
