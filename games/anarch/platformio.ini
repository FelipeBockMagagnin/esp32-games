[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
build_flags =
    ${board.build_flags}
    ; Held on its side: the panel draws 320x240
    -DDISPLAY_LANDSCAPE=1

; fps on the serial every 5 s: pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
