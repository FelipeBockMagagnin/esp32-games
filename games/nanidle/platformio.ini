[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board

; Serial commands for testing (screen <i>, shot, xp, gold, boss, level): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
