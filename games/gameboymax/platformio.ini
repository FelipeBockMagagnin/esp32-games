[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini
; The max edition: games/gameboy's source with every game of its library.json
src_dir = ../gameboy/src

[env:esp32dev]
extends = board
custom_tier = max
extra_scripts = pre:../gameboy/tools/pack.py
board_build.partitions = partitions_max.csv
build_flags =
    ${board.build_flags}
    ; common.ini looks for Theme.h in this project's src/ui, which lives in games/gameboy
    -I$PROJECT_DIR/../gameboy/src/ui

[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
