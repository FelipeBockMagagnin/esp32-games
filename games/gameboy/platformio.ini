[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

; The lite edition: the games that fit the default table's 1.25 MB app slot, so it installs
; beside others. games/gameboymax builds this same source with every game.
[env:esp32dev]
extends = board
custom_tier = lite
extra_scripts = pre:tools/pack.py

; Serial commands for testing (screen <i>, play <i>, shot): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${board.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
