[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
; The raycaster's inner loops gain more from speed than they cost in flash
build_unflags = -Os
build_flags =
    ${board.build_flags}
    -O2
    ; Held on its side: the UI lays out 320x240
    -DDISPLAY_LANDSCAPE=1

; Serial commands for testing (fps, next, shot): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
