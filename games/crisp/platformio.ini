[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
extra_scripts =
    pre:tools/carts.py
    post:tools/overlay.py
lib_deps =
    ${board.lib_deps}
    cglp
; The library's hashes count on a signed int wrapping, as it does on every board it runs on
build_flags =
    ${board.build_flags}
    -fwrapv

; Serial commands for testing (screen <i>, play <i>) and fps: pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
