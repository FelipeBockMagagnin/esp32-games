[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
build_flags =
    ${board.build_flags}
    ; Rows carry no subtitles, so a lone title sits in the row's middle
    -DLISTROW_CENTER_LONE=1

; Serial commands for testing (screen <i>, shot): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
