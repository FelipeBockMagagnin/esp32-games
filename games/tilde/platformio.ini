[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
; The framework builds for size (-Os), which runs the rasterizer's float loops several times slower
build_unflags = -Os
build_flags =
    ${board.build_flags}
    -O2
    ; sqrtf and friends inline instead of going through errno-setting library calls
    -fno-math-errno

; Serial cheats for testing (age, need, form, screen, theme, glyphs, shot): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
    -DPET_TOOLS=1
monitor_filters = send_on_enter
monitor_echo = yes
