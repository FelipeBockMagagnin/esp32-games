[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
; The framework builds for size (-Os), which runs the rasterizer's float loops several times slower
build_unflags = -Os
; TFT_eSPI config lives here so it survives `pio run -t clean` and library updates
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Only the built-in GLCD font is drawn; every other font costs flash
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT=1
    ; Silences TFT_eSPI's warning about the unwired touch pin
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -O2
    ; sqrtf and friends inline instead of going through errno-setting library calls
    -fno-math-errno

; Serial cheats for testing (age, need, form, screen, theme, glyphs, shot): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
    -DPET_TOOLS=1
monitor_filters = send_on_enter
monitor_echo = yes
