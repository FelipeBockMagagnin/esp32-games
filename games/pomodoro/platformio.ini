[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
build_flags =
    ${board.build_flags}
    ; Font 7's 48px seven-segment digits for the clock and timer
    -DLOAD_FONT7=1

; Serial commands for testing (src/debug/DevConsole): pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
