[platformio]
default_envs = esp32dev
extra_configs = ../../common.ini

[env:esp32dev]
extends = board
extra_scripts = pre:tools/sketches.py
; Named, since the library finder never sees the games that include them (tools/sketches.py)
lib_deps =
    ${board.lib_deps}
    Arduboy2
    ArduboyTones
    AvrShim
    FixedPoints
; lib/AvrShim's EEPROM.h stands in for the core's, which keeps its bytes in an NVS namespace
; of its own
lib_ignore = EEPROM
build_flags =
    ${board.build_flags}
    -DDISPLAY_LANDSCAPE=1
; The Arduino IDE builds AVR sketches with -fpermissive, and the games lean on it. A function
; that falls off its end without a value is an error: the AVR shrugged, the ESP32's GCC runs on
; into whatever code follows.
build_src_flags = -fpermissive -Wno-narrowing -Werror=return-type

; Serial commands for testing (screen <i>, play <i>) and fps: pio run -e dev -t upload -t monitor
[env:dev]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEV_MODE=1
monitor_filters = send_on_enter
monitor_echo = yes
